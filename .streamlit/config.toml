[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#FBFBFA"
secondaryBackgroundColor = "#F1F5F4"
textColor = "#1C2B2D"
linkColor = "#0F766E"
font = "Nunito:https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
headingFont = "Nunito:https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap"
headingFontWeights = [800, 800, 700, 700, 700, 700]
baseRadius = "0.75rem"
buttonRadius = "0.5rem"
baseFontSize = 15

[theme.sidebar]
backgroundColor = "#F5F7F7"
secondaryBackgroundColor = "#E8EDEC"

[browser]
gatherUsageStats = false
