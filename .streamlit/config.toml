[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#FBFBFA"
secondaryBackgroundColor = "#F1F5F4"
textColor = "#1C2B2D"
linkColor = "#0F766E"
font = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
baseRadius = "0.75rem"
buttonRadius = "0.5rem"
baseFontSize = 15

[theme.sidebar]
backgroundColor = "#F5F7F7"
secondaryBackgroundColor = "#E8EDEC"

[browser]
gatherUsageStats = false
